name: Pull Request Validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_VERSION: '22'

jobs:
  dotnet:
    name: dotnet-format-build-test
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore solution
        run: dotnet restore src/jobs/IMAPRemailer.sln

      - name: Restore CSharpier
        run: dotnet tool restore

      - name: Check C# formatting
        run: dotnet csharpier check src/jobs

      - name: Build with analyzers
        run: dotnet build src/jobs/IMAPRemailer.sln --no-restore --configuration Release /warnaserror

      - name: Run .NET tests with coverage
        run: dotnet test src/jobs/IMAPRemailer.sln --no-restore --configuration Release --collect:"XPlat Code Coverage" --settings src/jobs/coverage.runsettings --results-directory .codex/coverage

      - name: Require complete useful-code coverage
        shell: pwsh
        run: |
          $report = Get-ChildItem .codex/coverage -Recurse -Filter coverage.cobertura.xml | Select-Object -First 1
          [xml]$coverage = Get-Content $report.FullName
          if ($coverage.coverage.'line-rate' -ne '1' -or $coverage.coverage.'branch-rate' -ne '1') {
            throw "Couverture insuffisante : lignes $($coverage.coverage.'line-rate'), branches $($coverage.coverage.'branch-rate')."
          }

  lint:
    name: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

  prettier:
    name: prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run typecheck
        run: npm run typecheck

  build:
    name: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build workspace
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: functions-build
          path: src/client/functions/lib
          if-no-files-found: error
          retention-days: 7

  test:
    name: test-and-coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: src/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run coverage

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            src/client/functions/coverage
            src/client/web/coverage
          if-no-files-found: error
          retention-days: 7

  comment:
    name: comment
    if: always()
    needs:
      - dotnet
      - lint
      - prettier
      - typecheck
      - build
      - test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/client
    steps:
      - name: Publish PR status badges
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pop3-remailer-pr-validation -->';
            const toBadge = (label, result) => {
              const normalizedResult = result === 'success' ? 'success' : result === 'skipped' ? 'skipped' : 'failed';
              const color = normalizedResult === 'success'
                ? 'brightgreen'
                : normalizedResult === 'skipped'
                  ? 'lightgrey'
                  : 'red';

              return `![${label}](https://img.shields.io/badge/${encodeURIComponent(label)}-${encodeURIComponent(normalizedResult)}-${color})`;
            };

            const body = [
              marker,
              '## PR Validation',
              '',
              [
                toBadge('dotnet', '${{ needs.dotnet.result }}'),
                toBadge('lint', '${{ needs.lint.result }}'),
                toBadge('prettier', '${{ needs.prettier.result }}'),
                toBadge('typecheck', '${{ needs.typecheck.result }}'),
                toBadge('build', '${{ needs.build.result }}'),
                toBadge('test', '${{ needs.test.result }}'),
              ].join(' '),
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existingComment = comments.find((comment) =>
              comment.body.includes(marker),
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body,
              });
              return;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
